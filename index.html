<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<meta name="theme-color" content="#10091d">

<title>Esra'nın Dünyası 3D</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
 href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
 rel="stylesheet"
>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
}
</script>

<style>

:root{
    --bg:#0d0818;
    --panel:rgba(25,15,43,.88);
    --panel2:rgba(255,255,255,.055);
    --border:rgba(255,255,255,.12);
    --pink:#ff4f9a;
    --pink2:#ff79b5;
    --purple:#9a6cff;
    --text:#fff;
    --muted:#aaa0ba;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:"Plus Jakarta Sans",sans-serif;
    color:var(--text);
    background:
        radial-gradient(
            circle at 50% -10%,
            #442266 0%,
            #170d27 38%,
            #0d0818 80%
        );
}

button{
    font-family:inherit;
}

.app{
    width:100%;
    height:100dvh;
    display:grid;
    grid-template-rows:74px 1fr;
}

/* HEADER */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:10px 22px;

    border-bottom:1px solid var(--border);

    background:rgba(10,6,18,.72);

    backdrop-filter:blur(20px);

    z-index:30;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:45px;
    height:45px;

    display:grid;
    place-items:center;

    border-radius:15px;

    background:
        linear-gradient(
            135deg,
            #ff4f9a,
            #8b5cf6
        );

    box-shadow:
        0 8px 30px rgba(255,79,154,.35);

    font-size:21px;
}

.brand h1{
    font-size:16px;
    font-weight:800;
}

.brand p{
    margin-top:3px;
    font-size:10px;
    color:var(--muted);
}

.header-right{
    display:flex;
    align-items:center;
    gap:8px;
}

.badge{
    padding:8px 13px;
    border-radius:99px;

    border:1px solid var(--border);

    background:rgba(255,255,255,.055);

    font-size:10px;
    font-weight:800;
}

/* MAIN */

.main{
    min-height:0;

    display:grid;

    grid-template-columns:
        minmax(310px,360px)
        1fr;

    gap:14px;

    padding:14px;
}

/* PANEL */

.panel{
    min-height:0;

    display:flex;
    flex-direction:column;

    overflow:hidden;

    border:1px solid var(--border);

    border-radius:25px;

    background:var(--panel);

    backdrop-filter:blur(22px);

    box-shadow:
        0 25px 80px rgba(0,0,0,.42);
}

.panel-head{
    padding:18px 18px 12px;
}

.panel-head h2{
    font-size:15px;
    font-weight:800;
}

.panel-head span{
    display:block;
    margin-top:4px;
    font-size:10px;
    color:var(--muted);
}

/* TABS */

.tabs{
    display:grid;
    grid-template-columns:repeat(3,1fr);

    gap:5px;

    padding:8px 12px;

    background:rgba(0,0,0,.2);
}

.tab{
    border:0;
    border-radius:11px;

    padding:10px 4px;

    background:transparent;

    color:#a69cb6;

    font-size:10px;
    font-weight:800;

    cursor:pointer;
}

.tab.active{
    color:#fff;

    background:
        linear-gradient(
            135deg,
            var(--pink),
            var(--purple)
        );

    box-shadow:
        0 5px 20px rgba(255,79,154,.25);
}

/* CONTENT */

.content{
    flex:1;
    overflow-y:auto;

    padding:16px;

    scrollbar-width:thin;
}

.group{
    margin-bottom:19px;
}

.group-title{
    margin-bottom:9px;

    color:#b7adca;

    font-size:9px;
    font-weight:800;

    letter-spacing:.8px;

    text-transform:uppercase;
}

.options{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.option{
    border:1px solid var(--border);

    border-radius:11px;

    padding:9px 10px;

    background:rgba(255,255,255,.045);

    color:#eee;

    font-size:9px;
    font-weight:700;

    cursor:pointer;

    transition:.18s;
}

.option:hover{
    background:rgba(255,255,255,.1);
}

.option.selected{
    border-color:var(--pink);

    background:
        rgba(255,79,154,.17);

    color:#ff91bf;

    box-shadow:
        0 0 0 1px rgba(255,79,154,.08);
}

/* COLORS */

.colors{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
}

.color{
    width:28px;
    height:28px;

    border-radius:50%;

    border:2px solid rgba(255,255,255,.18);

    cursor:pointer;

    transition:.15s;
}

.color:hover{
    transform:scale(1.12);
}

.color.selected{
    border-color:white;

    outline:2px solid var(--pink);

    transform:scale(1.1);
}

/* SLIDER */

.slider{
    width:100%;
    accent-color:var(--pink);
}

/* FOOTER */

.panel-footer{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:7px;

    padding:12px 16px;

    border-top:1px solid var(--border);
}

.action{
    border:0;

    border-radius:12px;

    padding:11px;

    color:#fff;

    font-size:10px;
    font-weight:800;

    cursor:pointer;
}

.action.secondary{
    background:rgba(255,255,255,.07);

    border:1px solid var(--border);
}

.action.primary{
    background:
        linear-gradient(
            135deg,
            var(--pink),
            var(--purple)
        );
}

/* VIEWPORT */

.viewport{
    position:relative;

    min-width:0;
    min-height:0;

    overflow:hidden;

    border:1px solid var(--border);

    border-radius:25px;

    background:
        radial-gradient(
            circle at 50% 38%,
            #38204d 0%,
            #1a1027 35%,
            #0d0818 78%
        );

    box-shadow:
        inset 0 0 120px rgba(0,0,0,.55),
        0 25px 80px rgba(0,0,0,.3);
}

#scene{
    width:100%;
    height:100%;

    display:block;
}

/* VIEWPORT TOP */

.viewport-top{
    position:absolute;

    top:17px;
    left:18px;

    z-index:10;

    padding:8px 13px;

    border-radius:99px;

    border:1px solid var(--border);

    background:rgba(15,8,25,.6);

    backdrop-filter:blur(12px);

    font-size:10px;
    font-weight:800;
}

/* TOAST */

.toast{
    position:absolute;

    top:20px;
    left:50%;

    transform:
        translate(-50%,-15px);

    opacity:0;

    padding:10px 17px;

    border-radius:99px;

    background:
        linear-gradient(
            135deg,
            var(--pink),
            var(--purple)
        );

    box-shadow:
        0 8px 30px rgba(0,0,0,.35);

    font-size:10px;
    font-weight:800;

    pointer-events:none;

    transition:.25s;

    z-index:50;
}

.toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}

/* VIEW CONTROLS */

.controls{
    position:absolute;

    bottom:18px;
    left:50%;

    transform:translateX(-50%);

    display:flex;

    gap:5px;

    padding:6px;

    border-radius:99px;

    border:1px solid var(--border);

    background:rgba(13,8,24,.75);

    backdrop-filter:blur(18px);

    z-index:20;
}

.control{
    border:0;

    padding:9px 13px;

    border-radius:99px;

    background:transparent;

    color:#fff;

    font-size:9px;
    font-weight:800;

    cursor:pointer;
}

.control:hover{
    background:rgba(255,255,255,.1);
}

/* MOBILE */

@media(max-width:900px){

    .app{
        grid-template-rows:60px 1fr;
    }

    .header{
        padding:8px 12px;
    }

    .brand h1{
        font-size:13px;
    }

    .brand p{
        display:none;
    }

    .logo{
        width:38px;
        height:38px;
    }

    .badge{
        display:none;
    }

    .main{
        grid-template-columns:1fr;
        grid-template-rows:43% 57%;

        padding:8px;
    }

    .viewport{
        grid-row:1;
        border-radius:20px;
    }

    .panel{
        grid-row:2;
        border-radius:20px;
    }

}

</style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="brand">

            <div class="logo">
                🎀
            </div>

            <div>
                <h1>Esra'nın Dünyası 3D</h1>
                <p>Deluxe Moda & Gardırop Stüdyosu</p>
            </div>

        </div>

        <div class="header-right">

            <div class="badge">
                ✨ 20+ MODEL
            </div>

            <div class="badge">
                💎 DELUXE
            </div>

        </div>

    </header>


    <main class="main">

        <aside class="panel">

            <div class="panel-head">

                <h2>✨ Moda Stüdyosu</h2>

                <span>
                    Karakterini istediğin gibi tasarla
                </span>

            </div>


            <div class="tabs">

                <button
                    class="tab active"
                    data-tab="clothes"
                >
                    👗 Kıyafet
                </button>

                <button
                    class="tab"
                    data-tab="look"
                >
                    💇 Görünüm
                </button>

                <button
                    class="tab"
                    data-tab="accessory"
                >
                    👑 Aksesuar
                </button>

            </div>


            <div
                class="content"
                id="content"
            ></div>


            <div class="panel-footer">

                <button
                    class="action secondary"
                    id="randomBtn"
                >
                    🎲 Sürpriz Kombin
                </button>

                <button
                    class="action primary"
                    id="saveBtn"
                >
                    📸 Fotoğraf
                </button>

            </div>

        </aside>


        <section class="viewport">

            <div class="viewport-top">
                👗 3D FASHION STUDIO
            </div>

            <canvas id="scene"></canvas>

            <div
                class="toast"
                id="toast"
            >
                ✨ Tasarım değiştirildi
            </div>


            <div class="controls">

                <button
                    class="control"
                    id="rotateBtn"
                >
                    🔄 Döndür
                </button>

                <button
                    class="control"
                    id="poseBtn"
                >
                    💃 Poz
                </button>

                <button
                    class="control"
                    id="resetBtn"
                >
                    ↩ Sıfırla
                </button>

            </div>

        </section>

    </main>

</div>


<script type="module">

import * as THREE from "three";

import {
    OrbitControls
} from "three/addons/controls/OrbitControls.js";


/* ============================================================
   RENDERER
============================================================ */

const canvas =
    document.getElementById("scene");

const renderer =
    new THREE.WebGLRenderer({
        canvas,
        antialias:true,
        alpha:false,
        preserveDrawingBuffer:true
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.setSize(
    canvas.clientWidth,
    canvas.clientHeight,
    false
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    1.15;


/* ============================================================
   SCENE
============================================================ */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color("#120a1d");


/* ============================================================
   CAMERA
============================================================ */

const camera =
    new THREE.PerspectiveCamera(
        32,
        canvas.clientWidth /
        canvas.clientHeight,
        .1,
        100
    );

camera.position.set(
    0,
    2.05,
    7.2
);


/* ============================================================
   CONTROLS
============================================================ */

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping=true;

controls.dampingFactor=.055;

controls.minDistance=4.6;

controls.maxDistance=9;

controls.target.set(
    0,
    1.35,
    0
);


/* ============================================================
   LIGHTING
============================================================ */

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x392347,
        2.1
    )
);


const keyLight =
    new THREE.DirectionalLight(
        0xffffff,
        3.1
    );

keyLight.position.set(
    4.5,
    7,
    5
);

keyLight.castShadow=true;

keyLight.shadow.mapSize.set(
    2048,
    2048
);

keyLight.shadow.camera.near=.1;

keyLight.shadow.camera.far=20;

scene.add(keyLight);


const fillLight =
    new THREE.DirectionalLight(
        0xff8bc7,
        1.6
    );

fillLight.position.set(
    -4,
    4,
    3
);

scene.add(fillLight);


const rimLight =
    new THREE.PointLight(
        0x9d75ff,
        25,
        12
    );

rimLight.position.set(
    0,
    3,
    -4
);

scene.add(rimLight);


/* ============================================================
   FLOOR
============================================================ */

const floor =
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            2.05,
            2.2,
            .14,
            96
        ),

        new THREE.MeshStandardMaterial({
            color:"#2b183d",
            roughness:.35,
            metalness:.45
        })

    );

floor.position.y=-.07;

floor.receiveShadow=true;

scene.add(floor);


const floorRing =
    new THREE.Mesh(

        new THREE.TorusGeometry(
            1.82,
            .025,
            12,
            96
        ),

        new THREE.MeshStandardMaterial({
            color:"#ff5aa7",
            roughness:.2,
            metalness:.8
        })

    );

floorRing.rotation.x =
    Math.PI / 2;

floorRing.position.y=.015;

scene.add(floorRing);


/* ============================================================
   CHARACTER ROOT
============================================================ */

const character =
    new THREE.Group();

scene.add(character);


/* ============================================================
   STATE
============================================================ */

const state={

    category:"dress",

    model:"princess",

    color:"#ed65ad",

    topColor:"#9d83e8",

    shoeColor:"#ffffff",

    hair:"#58334c",

    hairStyle:"long",

    skin:"#f1c5a6",

    accessory:"tiara",

    pose:0,

    zoom:0

};


/* ============================================================
   MATERIAL
============================================================ */

function material(
    color,
    roughness=.45,
    metalness=.05
){

    return new THREE.MeshStandardMaterial({
        color,
        roughness,
        metalness
    });

}


/* ============================================================
   BASIC MESH HELPERS
============================================================ */

function addSphere(
    parent,
    color,
    position,
    scale
){

    const mesh =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                1,
                32,
                24
            ),

            material(color)
        );

    mesh.position.set(
        ...position
    );

    mesh.scale.set(
        ...scale
    );

    mesh.castShadow=true;

    mesh.receiveShadow=true;

    parent.add(mesh);

    return mesh;

}


function addCapsule(
    parent,
    color,
    position,
    radius,
    length
){

    const mesh =
        new THREE.Mesh(

            new THREE.CapsuleGeometry(
                radius,
                length,
                8,
                24
            ),

            material(color)
        );

    mesh.position.set(
        ...position
    );

    mesh.castShadow=true;

    mesh.receiveShadow=true;

    parent.add(mesh);

    return mesh;

}


function addCylinder(
    parent,
    color,
    position,
    radiusTop,
    radiusBottom,
    height,
    segments=48
){

    /*
        Three.js sırası:

        radiusTop
        radiusBottom
        height

        Böylece artık etekleri ters çevirmiyoruz.
    */

    const mesh =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                radiusTop,
                radiusBottom,
                height,
                segments
            ),

            material(color)
        );

    mesh.position.set(
        ...position
    );

    mesh.castShadow=true;

    mesh.receiveShadow=true;

    parent.add(mesh);

    return mesh;

}


/* ============================================================
   PERFECTLY SYMMETRIC SKIRT
============================================================ */

function skirt(
    color,
    y,
    radiusTop,
    radiusBottom,
    height
){

    const garment =
        new THREE.Group();

    garment.position.set(
        0,
        0,
        0
    );

    const mesh =
        addCylinder(
            garment,
            color,
            [0,y,0],
            radiusTop,
            radiusBottom,
            height,
            72
        );

    mesh.rotation.set(
        0,
        0,
        0
    );

    character.add(
        garment
    );

    return garment;

}


/* ============================================================
   PLEATED SKIRT
============================================================ */

function pleatedSkirt(
    color,
    y,
    topRadius,
    bottomRadius,
    height
){

    const geometry =
        new THREE.CylinderGeometry(
            topRadius,
            bottomRadius,
            height,
            96,
            1,
            false
        );

    /*
        Radyal yüzeyde düzenli pile.
        Bütün noktalar merkezden eşit uzaklıkta.
    */

    const pos =
        geometry.attributes.position;

    for(
        let i=0;
        i<pos.count;
        i++
    ){

        const x =
            pos.getX(i);

        const z =
            pos.getZ(i);

        const angle =
            Math.atan2(z,x);

        const radius =
            Math.sqrt(
                x*x+z*z
            );

        const folds=24;

        const wave =
            Math.cos(
                angle*folds
            );

        const factor =
            1 + wave*.055;

        pos.setX(
            i,
            x*factor
        );

        pos.setZ(
            i,
            z*factor
        );

    }

    pos.needsUpdate=true;

    geometry.computeVertexNormals();


    const mesh =
        new THREE.Mesh(
            geometry,
            material(color,.4)
        );

    mesh.position.y=y;

    mesh.castShadow=true;

    mesh.receiveShadow=true;

    character.add(mesh);

}


/* ============================================================
   LAYER
============================================================ */

function layer(
    color,
    y,
    top,
    bottom,
    height
){

    skirt(
        color,
        y,
        top,
        bottom,
        height
    );

}


/* ============================================================
   TOP
============================================================ */

function makeTop(
    color,
    style="elegant"
){

    if(style==="crop"){

        addCylinder(
            character,
            color,
            [0,1.51,0],
            .235,
            .285,
            .27
        );

        return;
    }


    if(style==="strapless"){

        addCylinder(
            character,
            color,
            [0,1.53,0],
            .245,
            .29,
            .35
        );

        return;
    }


    if(style==="oversize"){

        addCylinder(
            character,
            color,
            [0,1.50,0],
            .29,
            .34,
            .47
        );

        return;
    }


    if(style==="jacket"){

        addCylinder(
            character,
            color,
            [0,1.51,0],
            .30,
            .33,
            .45
        );

        return;
    }


    addCylinder(
        character,
        color,
        [0,1.50,0],
        .24,
        .29,
        .42
    );

}


/* ============================================================
   BELT
============================================================ */

function belt(
    color="#f5cf69",
    y=1.31,
    radius=.29
){

    const mesh =
        new THREE.Mesh(

            new THREE.TorusGeometry(
                radius,
                .025,
                10,
                64
            ),

            material(
                color,
                .25,
                .55
            )
        );

    mesh.rotation.x =
        Math.PI/2;

    mesh.position.y=y;

    character.add(mesh);

}


/* ============================================================
   PANTS
============================================================ */

function pants(
    color,
    type="straight"
){

    let radius=.125;

    let length=.66;


    if(type==="skinny"){

        radius=.102;
        length=.70;

    }


    if(type==="wide"){

        radius=.18;
        length=.63;

    }


    if(type==="flare"){

        radius=.135;
        length=.65;

    }


    if(type==="cargo"){

        radius=.145;
        length=.65;

    }


    addCapsule(
        character,
        color,
        [-.215,.69,0],
        radius,
        length
    );


    addCapsule(
        character,
        color,
        [.215,.69,0],
        radius,
        length
    );


    if(type==="cargo"){

        addBoxPocket(
            color,
            [-.355,.83,.04]
        );

        addBoxPocket(
            color,
            [.355,.83,.04]
        );

    }

}


function addBoxPocket(
    color,
    position
){

    const mesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .09,
                .13,
                .05
            ),

            material(color)
        );

    mesh.position.set(
        ...position
    );

    mesh.castShadow=true;

    character.add(mesh);

}


/* ============================================================
   SHORTS
============================================================ */

function shorts(
    color,
    mini=false
){

    const height =
        mini ? .17 : .24;

    const radius =
        mini ? .145 : .17;


    addCylinder(
        character,
        color,
        [-.13,1.13,0],
        radius,
        radius+.025,
        height,
        32
    );


    addCylinder(
        character,
        color,
        [.13,1.13,0],
        radius,
        radius+.025,
        height,
        32
    );

}


/* ============================================================
   SHOES
============================================================ */

function shoes(){

    addSphere(

/* ============================================================
   HAIR
============================================================ */

function makeHair(){

    const hair =
        state.hair;


    addSphere(
        character,
        hair,
        [0,2.43,-.01],
        [.36,.24,.32]
    );


    if(
        state.hairStyle==="long"
    ){

        addSphere(
            character,
            hair,
            [-.29,2.15,-.04],
            [.105,.38,.15]
        );

        addSphere(
            character,
            hair,
            [.29,2.15,-.04],
            [.105,.38,.15]
        );

    }


    if(
        state.hairStyle==="bob"
    ){

        addSphere(
            character,
            hair,
            [-.28,2.25,-.02],
            [.10,.23,.15]
        );

        addSphere(
            character,
            hair,
            [.28,2.25,-.02],
            [.10,.23,.15]
        );

    }


    if(
        state.hairStyle==="ponytail"
    ){

        addSphere(
            character,
            hair,
            [0,2.42,-.30],
            [.13,.28,.13]
        );

    }


    if(
        state.hairStyle==="curly"
    ){

        for(
            let i=0;
            i<14;
            i++
        ){

            const angle =
                i /
                14 *
                Math.PI*2;

            addSphere(
                character,
                hair,
                [
                    Math.cos(angle)*.31,
                    2.27 +
                    Math.sin(i*2)*.045,
                    Math.sin(angle)*.22
                ],
                [.115,.13,.115]
            );

        }

    }

}

function accessories(){

    if(
        state.accessory==="none"
    ){
        return;
    }


    if(
        state.accessory==="tiara"
    ){

        const gold =
            material(
                "#f5cf69",
                .22,
                .7
            );

        const crown =
            new THREE.Mesh(

                new THREE.TorusGeometry(
                    .22,
                    .024,
                    10,
                    48
                ),

                gold
            );

        crown.position.set(
            0,
            2.54,
            .04
        );

        crown.rotation.x=
            Math.PI/2;

        crown.scale.y=.55;

        character.add(crown);


        for(
            let i=-2;
            i<=2;
            i++
        ){

            const jewel =
                new THREE.Mesh(

                    new THREE.ConeGeometry(
                        .025,
                        .08,
                        4

                    gold

            jewel.position.set(
                i*.065,

            );

            character.add(jewel);

    if(
        state.accessory==="bow"
    ){

        addSphere(

        );

            [.11,2.51,.10],
            [.12,.075,.045]
        );

        addSphere(
            character,

    if(
        state.accessory==="necklace"
    ){

            material(
                "#f5cf69",

                .65
            );

        const necklace =
            new THREE.Mesh(

/* ============================================================
   FULL CHARACTER BUILD
============================================================ */

function buildCharacter(){

    while(
        character.children.length
    ){

        character.remove(
            character.children[0]
        );

    }


    body();

    buildClothing();

    accessories();


    character.position.y=.06;

}

/* ============================================================
   TOAST
============================================================ */

function toast(text){

    const element =
        document.getElementById(
            "toast"
        );

    element.textContent=text;

    element.classList.add(
        "show"
    );

    setTimeout(
        ()=>{
            element.classList.remove(
                "show"
            );
        },
        1800
    );

}


/* ============================================================
   OPTIONS HTML
============================================================ */

function optionsHTML(
    list,
    key
){

    return list.map(
        item=>`

        <button
            class="option ${
                state.model===item[0]
                ?"selected":""
            }"
            data-${key}="${item[0]}"
        >
            ${item[1]}
        </button>

        `
    ).join("");

}


function colorsHTML(
    current,
    key
){

    return colorList.map(
        color=>`

        <div
            class="color ${
                current===color
                ?"selected":""
            }"
            style="background:${color}"
            data-${key}="${color}"
        ></div>

        `
    ).join("");

}

                Math.floor(
                    Math.random()*
                    colorList.length
                )
            ];


        state.topColor=
            colorList[
                Math.floor(
                    Math.random()*
                    colorList.length
                )
            ];


        state.hairStyle=[
            "long",
            "bob",
            "ponytail",
            "curly"
        ][
            Math.floor(
                Math.random()*4
            )
        ];


        state.accessory=[
            "none",
            "tiara",
            "bow",
            "necklace",
            "earrings",
            "bag"
        ][
            Math.floor(
                Math.random()*6
            )
        ];


        buildCharacter();

        renderUI();

        toast(
            "🎲 Yeni kombin hazır!"
        );

    };


/* ============================================================
   ROTATE
============================================================ */

let autoRotate=false;

document
    .getElementById("rotateBtn")
    .onclick=()=>{

        autoRotate=
            !autoRotate;

        toast(
            autoRotate
            ? "🔄 Podyum dönüyor"
            : "⏸ Dönüş durdu"
        );

    };


/* ============================================================
   POSE
============================================================ */

let poseIndex=0;

document
    .getElementById("poseBtn")
    .onclick=()=>{

        poseIndex++;

        if(
            poseIndex>3
        ){

            poseIndex=0;

        }


        if(
            poseIndex===0
        ){

            character.rotation.z=0;

        }


        if(
            poseIndex===1
        ){

            character.rotation.z=
                -.045;

        }


        if(
            poseIndex===2
        ){

            character.rotation.z=
                .045;

        }


        if(
            poseIndex===3
        ){

            character.rotation.z=
                -.08;

        }


        toast(
            "💃 Poz değiştirildi"
        );

    };


/* ============================================================
   RESET
============================================================ */

document
    .getElementById("resetBtn")
    .onclick=()=>{

        character.rotation.set(
            0,
            0,
            0
        );

        camera.position.set(
            0,
            2.05,
            7.2
        );

        controls.target.set(
            0,
            1.35,
            0
        );

        controls.update();

        autoRotate=false;

        toast(
            "↩ Stüdyo sıfırlandı"
        );

    };


/* ============================================================
   SAVE IMAGE
============================================================ */

document
    .getElementById("saveBtn")
    .onclick=()=>{

        renderer.render(
            scene,
            camera
        );


        const link =
            document.createElement(
                "a"
            );

        link.download=
            "esranin-dunyasi-3d.png";

        link.href=
            renderer.domElement
                .toDataURL(
                    "image/png"
                );

        link.click();

        toast(
            "📸 Kombin fotoğrafı kaydedildi"
        );

    };


/* ============================================================
   RESIZE
============================================================ */

window.addEventListener(
    "resize",
    ()=>{

        const width =
            canvas.clientWidth;

        const height =
            canvas.clientHeight;


        renderer.setSize(
            width,
            height,
            false
        );


        camera.aspect =
            width /
            height;

        camera.updateProjectionMatrix();

    }
);


/* ============================================================
   START
============================================================ */

buildCharacter();

renderUI();


/* ============================================================
   ANIMATION
============================================================ */

function animate(){

    requestAnimationFrame(
        animate
    );


    if(autoRotate){

        character.rotation.y +=
            .006;

    }


    controls.update();

    renderer.render(
        scene,
        camera
    );

}

animate();

</script>
